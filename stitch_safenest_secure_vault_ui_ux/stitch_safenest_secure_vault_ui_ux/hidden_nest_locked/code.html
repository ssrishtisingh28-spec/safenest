<style>
        /* Kinetic Feedback & Security Animations */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.8; transform: scale(1); box-shadow: 0 0 20px rgba(137, 206, 255, 0.2); }
            50% { opacity: 1; transform: scale(1.02); box-shadow: 0 0 40px rgba(137, 206, 255, 0.4); }
        }
        
        .biometric-pulse {
            animation: subtle-pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            background: radial-gradient(circle at center, rgba(137, 206, 255, 0.05) 0%, transparent 70%);
        }

        /* Inner Glow Border for Glassmorphism */
        .glass-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.02) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
