<style>

<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop relative overflow-hidden">
<!-- Atmospheric Background Layers -->
<div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-surface-container-high/50 via-background to-background -z-10 pointer-events-none"></div>
<div class="absolute -top-64 -left-64 w-128 h-128 bg-primary/10 rounded-full blur-[120px] -z-10 pointer-events-none mix-blend-screen"></div>
<div class="absolute -bottom-64 -right-64 w-128 h-128 bg-secondary-container/10 rounded-full blur-[120px] -z-10 pointer-events-none mix-blend-screen"></div>
<main class="w-full max-w-[480px] bg-surface-container/80 backdrop-blur-[12px] rounded-xl p-gutter inner-glow ambient-shadow flex flex-col gap-6 relative z-10">
<!-- Header -->
<header class="text-center flex flex-col gap-2">
<div class="flex justify-center mb-2">
<span class="material-symbols-outlined text-[40px] text-primary" style="font-variation-settings: 'FILL' 1;">shield_lock</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg gradient-text">Create SafeNest</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Fortify your digital sanctuary.</p>
</header>
<!-- Divider -->
<div class="h-px w-full bg-white/5"></div>
<!-- Form -->
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50">person</span>
<input class="w-full bg-[#080C14] text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 recessed-input focus:outline-none" id="fullName" placeholder="Enter your full name" type="text"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50">mail</span>
<input class="w-full bg-[#080C14] text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 recessed-input focus:outline-none" id="email" placeholder="Enter your email" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="phone">Phone Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50">call</span>
<input class="w-full bg-[#080C14] text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 recessed-input focus:outline-none" id="phone" placeholder="Enter your phone number" type="tel"/>
</div>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="password">Create Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50">key</span>
<input class="w-full bg-[#080C14] text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-10 recessed-input focus:outline-none" id="password" placeholder="Create a strong password" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="mt-2 flex gap-1 w-full h-1 rounded-full overflow-hidden bg-surface-container-highest">
<div class="h-full bg-error w-1/4 transition-all duration-300"></div>
<div class="h-full bg-surface-container-highest w-1/4 transition-all duration-300"></div>
<div class="h-full bg-surface-container-highest w-1/4 transition-all duration-300"></div>
<div class="h-full bg-surface-container-highest w-1/4 transition-all duration-300"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-1 ml-1">Weak password</p>
</div>
<div class="flex flex-col gap-1">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-1" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50">lock</span>
<input class="w-full bg-[#080C14] text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-10 recessed-input focus:outline-none" id="confirmPassword" placeholder="Confirm your password" type="password"/>
</div>
</div>
<div class="flex items-start gap-2 mt-2">
<div class="relative flex items-center h-5">
<input aria-describedby="terms-description" class="w-4 h-4 rounded bg-[#080C14] border-outline-variant text-primary focus:ring-primary focus:ring-offset-background checked:bg-primary" id="terms" name="terms" type="checkbox"/>
</div>
<div class="text-sm">
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:underline transition-all" href="#">Terms of Service</a> and <a class="text-primary hover:underline transition-all" href="#">Privacy Policy</a>.
                    </label>
</div>
</div>
<button class="mt-4 w-full py-3 rounded-lg font-label-md text-label-md text-on-primary bg-primary gradient-bg shadow-[0_4px_14px_rgba(137,206,255,0.39)] hover:shadow-[0_6px_20px_rgba(137,206,255,0.23)] hover:-translate-y-[1px] transition-all duration-200 flex justify-center items-center gap-2" type="submit">
<span>Create SafeNest</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="text-center mt-2">
<p class="font-label-md text-label-md text-on-surface-variant">
                Already have an account? <a class="text-primary font-semibold hover:text-surface-tint transition-colors ml-1" href="#">Login</a>
</p>
</div>
</main>
<script>
        // Simple password strength visualization logic (visual only)
        const passwordInput = document.getElementById('password');
        const strengthBars = document.querySelectorAll('.mt-2.flex.gap-1 > div');
        const strengthText = document.querySelector('.mt-2.flex.gap-1 + p');

        passwordInput.addEventListener('input', function(e) {
            const val = e.target.value;
            let strength = 0;
            
            if (val.length > 0) strength += 1;
            if (val.length > 5) strength += 1;
            if (val.length > 8 && /[A-Z]/.test(val) && /[0-9]/.test(val)) strength += 1;
            if (val.length > 10 && /[^A-Za-z0-9]/.test(val)) strength += 1;

            strengthBars.forEach((bar, index) => {
                bar.className = 'h-full w-1/4 transition-all duration-300 ' + 
                    (index < strength ? 
                        (strength === 1 ? 'bg-error' : strength === 2 ? 'bg-tertiary' : strength === 3 ? 'bg-secondary' : 'bg-primary') 
                        : 'bg-surface-container-highest');
            });

            const textColors = ['text-on-surface-variant', 'text-error', 'text-tertiary', 'text-secondary', 'text-primary'];
            const textLabels = ['Enter password', 'Weak', 'Fair', 'Good', 'Strong'];
            
            strengthText.className = `font-label-sm text-label-sm mt-1 ml-1 ${textColors[strength]}`;
            strengthText.textContent = textLabels[strength] + (strength > 0 ? ' password' : '');
        });
    </script>
