<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SafeNest - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=Geist:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface": "#d4e4fa",
                        "inverse-surface": "#d4e4fa",
                        "surface-variant": "#273647",
                        "surface-tint": "#89ceff",
                        "primary": "#89ceff",
                        "on-surface-variant": "#bec8d2",
                        "secondary-container": "#00a6e0",
                        "on-secondary-fixed-variant": "#004c69",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#2c3a4c",
                        "surface-container-highest": "#273647",
                        "on-primary-fixed-variant": "#004c6e",
                        "on-secondary-fixed": "#001e2c",
                        "on-primary-container": "#003751",
                        "on-secondary": "#00354a",
                        "on-tertiary-fixed-variant": "#414756",
                        "primary-fixed-dim": "#89ceff",
                        "surface-container-lowest": "#010f1f",
                        "tertiary-container": "#959bad",
                        "inverse-primary": "#006591",
                        "on-primary-fixed": "#001e2f",
                        "outline": "#88929b",
                        "primary-fixed": "#c9e6ff",
                        "background": "#051424",
                        "surface": "#051424",
                        "inverse-on-surface": "#233143",
                        "secondary": "#7bd0ff",
                        "on-error": "#690005",
                        "tertiary-fixed": "#dde2f6",
                        "surface-container-high": "#1c2b3c",
                        "surface-dim": "#051424",
                        "surface-container-low": "#0d1c2d",
                        "on-primary": "#00344d",
                        "error": "#ffb4ab",
                        "on-tertiary-fixed": "#151b29",
                        "on-background": "#d4e4fa",
                        "secondary-fixed": "#c4e7ff",
                        "surface-container": "#122131",
                        "on-tertiary": "#2a303f",
                        "on-secondary-container": "#00374d",
                        "outline-variant": "#3e4850",
                        "primary-container": "#0ea5e9",
                        "tertiary-fixed-dim": "#c1c6d9",
                        "tertiary": "#c1c6d9",
                        "on-tertiary-container": "#2d3342",
                        "error-container": "#93000a",
                        "secondary-fixed-dim": "#7bd0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "margin-mobile": "20px",
                        "container-max": "1200px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Geist"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Geist"],
                        "headline-xl": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .inner-glow {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }
        .input-inset {
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.2);
        }
        .ambient-shadow {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .glass-panel {
            background-color: rgba(39, 54, 71, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<!-- Abstract Background Elements for Depth -->
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/5 blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-secondary-container/10 blur-[150px] pointer-events-none"></div>
<div class="w-full max-w-[440px] z-10">
<!-- Logo Container -->
<div class="flex justify-center mb-8">
<div class="w-20 h-20 rounded-2xl glass-panel inner-glow flex items-center justify-center shadow-[0_8px_32px_rgba(0,0,0,0.5)]">
<img alt="SafeNest Logo" class="w-12 h-12 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6G6HdAsLW1o7wOiQu_0WAMCeymisE3Q-2W1lpegFKj8d14TsFF5GoMs0dN5Lns_QgvUzZAoYhQTSsdSIf237rMf3vASa_RAvFFHEejLL6rUISuT4PwEfQ31DG9xaA8_C3HnL0M2UNZWEfsOslsyzlWQ7OywMqZE_lmcsd1dPIRVNbNg6pqL1GgsfGTFonKGwpDOuE34JSMssqDJDs-qoet9tTYaz1KXPfo_f-JnsbAGvTGJRaNbRt"/>
</div>
</div>
<!-- Login Card -->
<div class="glass-panel inner-glow rounded-xl ambient-shadow p-8 flex flex-col gap-6">
<!-- Header -->
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your digital nest is waiting.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email / User ID</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors z-10" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-[#080C14] input-inset border-none rounded-lg font-body-md text-body-md text-on-surface pl-10 pr-4 py-3 focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-on-surface-variant/50" id="email" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors z-10" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-[#080C14] input-inset border-none rounded-lg font-body-md text-body-md text-on-surface pl-10 pr-12 py-3 focus:ring-1 focus:ring-primary focus:outline-none transition-all placeholder:text-on-surface-variant/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-4 h-4 rounded-[4px] border border-outline-variant bg-[#080C14] checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-0 focus:outline-none transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute text-background text-[14px] opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-4">
<button class="w-full bg-gradient-to-r from-primary-container to-secondary-container hover:from-primary hover:to-secondary text-on-primary rounded-lg py-3 font-label-md text-label-md shadow-[0_4px_14px_rgba(14,165,233,0.2)] hover:shadow-[0_6px_20px_rgba(14,165,233,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                        Login
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-white/5"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant">OR</span>
<div class="flex-grow border-t border-white/5"></div>
</div>
<button class="w-full bg-transparent inner-glow rounded-lg py-3 font-label-md text-label-md text-on-surface hover:bg-white/5 transition-all active:scale-[0.98] flex items-center justify-center gap-3" type="button">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 0;">fingerprint</span>
                        Login with Biometrics
                    </button>
</div>
</form>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-label-md text-label-md text-on-surface-variant">
                New to SafeNest? 
                <a class="text-primary hover:text-secondary-container font-semibold transition-colors ml-1" href="#">Create Account</a>
</p>
</div>
</div>
</body></html>
