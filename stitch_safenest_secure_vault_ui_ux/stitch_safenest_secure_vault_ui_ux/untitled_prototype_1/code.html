<style>
        .pulse-glow {
            animation: pulse-glow 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-glow {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.95);
            }
            50% {
                opacity: 0.6;
                transform: scale(1.05);
            }
        }

        .spinner {
            border: 2px solid theme('colors.surface-variant');
            border-top: 2px solid theme('colors.primary');
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Ambient background glow */
        .ambient-glow {
            background: radial-gradient(circle at center, rgba(93, 64, 55, 0.15) 0%, rgba(251, 249, 244, 0) 70%);
        }
    </style>
</head>
<body class="bg-background text-on-surface h-screen w-screen overflow-hidden flex flex-col justify-center items-center relative font-body-lg">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 ambient-glow z-0 pointer-events-none"></div>
<!-- Center Content -->
<div class="relative z-10 flex flex-col items-center justify-center text-center px-margin-mobile md:px-margin-desktop max-w-md w-full">
<!-- Logo Container with Pulse Effect -->
<div class="relative w-32 h-32 mb-8 flex items-center justify-center">

        </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-xs mx-auto drop-shadow-sm">
            Your private space for everything important.
        </p>

<div class="spinner"></div>
</div>
