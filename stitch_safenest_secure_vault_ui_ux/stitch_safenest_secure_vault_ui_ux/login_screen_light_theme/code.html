<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SafeNest - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#fbf9f4",
                        "surface-dim": "#dbdad5",
                        "surface-bright": "#fbf9f4",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f5f3ee",
                        "surface-container": "#efeee9",
                        "surface-container-high": "#e9e8e3",
                        "surface-container-highest": "#e3e2dd",
                        "on-surface": "#1c1b1a",
                        "on-surface-variant": "#4d4642",
                        "outline": "#7f7570",
                        "outline-variant": "#d1c4be",
                        "inverse-surface": "#31302e",
                        "inverse-on-surface": "#f3f0eb",
                        "surface-tint": "#855342",
                        "primary": "#855342",
                        "on-primary": "#ffffff",
                        "primary-container": "#ffdbcd",
                        "on-primary-container": "#351005",
                        "secondary": "#74594f",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#ffdbcd",
                        "on-secondary-container": "#2a160e",
                        "tertiary": "#6b5e2f",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#f4e2a7",
                        "on-tertiary-container": "#221b00",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-error-container": "#410002",
                        "background": "#fbf9f4",
                        "on-background": "#1c1b1a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "margin-mobile": "20px",
                        "container-max": "1200px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Manrope"],
                        "headline-lg": ["Manrope"],
                        "label-md": ["Manrope"],
                        "body-md": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "label-sm": ["Manrope"],
                        "headline-xl": ["Manrope"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .inner-glow {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }
        .input-inset {
            box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.05);
        }
        .ambient-shadow {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }
        .glass-panel {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
<!-- Abstract Background Elements for Depth -->
<div class="absolute top-[-20%] left-[-10%] w-[50%] h-[50%] rounded-full bg-primary/10 blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[60%] h-[60%] rounded-full bg-tertiary-container/30 blur-[150px] pointer-events-none"></div>
<div class="w-full max-w-[440px] z-10">
<!-- Logo Container -->
<div class="flex justify-center mb-8">
<div class="w-20 h-20 rounded-[8px] glass-panel inner-glow flex items-center justify-center shadow-[0_8px_32px_rgba(0,0,0,0.1)]">
<img alt="SafeNest Logo" class="w-12 h-12 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC6G6HdAsLW1o7wOiQu_0WAMCeymisE3Q-2W1lpegFKj8d14TsFF5GoMs0dN5Lns_QgvUzZAoYhQTSsdSIf237rMf3vASa_RAvFFHEejLL6rUISuT4PwEfQ31DG9xaA8_C3HnL0M2UNZWEfsOslsyzlWQ7OywMqZE_lmcsd1dPIRVNbNg6pqL1GgsfGTFonKGwpDOuE34JSMssqDJDs-qoet9tTYaz1KXPfo_f-JnsbAGvTGJRaNbRt"/>
</div>
</div>
<!-- Login Card -->
<div class="glass-panel inner-glow rounded-[8px] ambient-shadow p-8 flex flex-col gap-6">
<!-- Header -->
<div class="text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your digital nest is waiting.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-5">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="email">Email / User ID</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors z-10" style="font-variation-settings: 'FILL' 0;">person</span>
<input class="w-full bg-surface-container-highest input-inset border border-outline-variant rounded-[8px] font-body-md text-body-md text-on-surface pl-10 pr-4 py-3 focus:ring-1 focus:ring-primary focus:border-primary focus:outline-none transition-all placeholder:text-on-surface-variant/70" id="email" placeholder="Enter your credentials" type="text"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant px-1" for="password">Password</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors z-10" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-highest input-inset border border-outline-variant rounded-[8px] font-body-md text-body-md text-on-surface pl-10 pr-12 py-3 focus:ring-1 focus:ring-primary focus:border-primary focus:outline-none transition-all placeholder:text-on-surface-variant/70" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-1 rounded-md focus:outline-none focus:ring-2 focus:ring-primary/50" type="button">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">visibility</span>
</button>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<div class="relative flex items-center justify-center">
<input class="peer appearance-none w-4 h-4 rounded-[4px] border border-outline bg-surface-container-highest checked:bg-primary checked:border-primary focus:ring-2 focus:ring-primary/50 focus:ring-offset-0 focus:outline-none transition-all" type="checkbox"/>
<span class="material-symbols-outlined absolute text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Remember Me</span>
</label>
<a class="font-label-md text-label-md text-primary hover:text-secondary transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 mt-4">
<button class="w-full bg-primary hover:bg-secondary text-on-primary rounded-[8px] py-3 font-label-md text-label-md shadow-[0_4px_14px_rgba(133,83,66,0.2)] hover:shadow-[0_6px_20px_rgba(133,83,66,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-2" type="submit">
                    Login
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="flex-shrink-0 mx-4 font-label-sm text-label-sm text-on-surface-variant">OR</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<button class="w-full bg-surface-container border border-outline-variant rounded-[8px] py-3 font-label-md text-label-md text-on-surface hover:bg-surface-container-high transition-all active:scale-[0.98] flex items-center justify-center gap-3" type="button">
<span class="material-symbols-outlined text-primary text-[20px]" style="font-variation-settings: 'FILL' 0;">fingerprint</span>
                    Login with Biometrics
                </button>
</div>
</form>
</div>
<!-- Footer -->
<div class="mt-8 text-center">
<p class="font-label-md text-label-md text-on-surface-variant">
            New to SafeNest? 
            <a class="text-primary hover:text-secondary font-semibold transition-colors ml-1" href="#">Create Account</a>
</p>
</div>
</div>
</body></html>
